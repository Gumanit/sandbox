name: CI Pipeline

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      VERSION:
        required: false
        type: string

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate version
        id: version
        run: echo "version=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."${{ secrets.NEXUS_HOST }}"]
              http = true
              insecure = true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker insecure registry
        run: |
          echo '{"insecure-registries":["${{ secrets.NEXUS_HOST }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Login to Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_HOST }}
          username: ${{ secrets.NEXUS_REPO_USER }}
          password: ${{ secrets.NEXUS_REPO_PASS }}

      - name: Metadata action
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.component }}
            ${{ secrets.NEXUS_HOST }}/nagaev-${{ matrix.component }}-docker/sandbox-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [version, build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production 
    env:
      VM_HOST: ${{ vars.VM_HOST || secrets.VM_HOST }}
      VM_USER: ${{ vars.VM_USER || secrets.VM_USER }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || secrets.NEXUS_HOST }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          set -euo pipefail
          DEPLOY_VERSION="${{ github.event.inputs.VERSION }}"
          if [ -z "$DEPLOY_VERSION" ]; then
            DEPLOY_VERSION="${{ needs.version.outputs.version }}"
          fi
          
          printf '%s\n' "${{ secrets.APP_ENV_FILE }}" > .env
          {
            echo "IMAGE_REGISTRY=$IMAGE_REGISTRY"
            echo "IMAGE_TAG=$DEPLOY_VERSION"
            echo "VERSION=$DEPLOY_VERSION"
            echo "REPOSITORY_BACKEND=$IMAGE_REGISTRY/nagaev-backend-docker/sandbox-backend"
            echo "REPOSITORY_FRONTEND=$IMAGE_REGISTRY/nagaev-frontend-docker/sandbox-frontend"
          } >> .env

      - name: Setup SSH and upload files
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${VM_HOST:?VM_HOST is empty — создайте Variables VM_HOST}"
          : "${VM_USER:?VM_USER is empty — создайте Variables VM_USER}"
          : "${VM_SSH_KEY:?secret VM_SSH_KEY is empty}"

          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -T 10 -H "$VM_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

          # ВНИМАНИЕ: Файл deploy.sh должен существовать в репозитории!
          scp -v -i ~/.ssh/id_rsa \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              docker-compose.yml .env deploy.sh "$VM_USER@$VM_HOST:~/"

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/id_rsa \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$VM_USER@$VM_HOST" << EOF
            set -euo pipefail
            cd ~/
            echo "${{ secrets.NEXUS_REPO_PASS }}" | docker login "$IMAGE_REGISTRY" -u "${{ secrets.NEXUS_REPO_USER }}" --password-stdin
            chmod +x deploy.sh
            ./deploy.sh
          EOF

      - name: Health check
        run: |
          curl -f "http://$VM_HOST:8081/health" || exit 1