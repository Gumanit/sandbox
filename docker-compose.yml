version: '3.8'

services:
  backend:
    image: ${REPOSITORY_BACKEND}:${IMAGE_TAG:-latest}
    container_name: sandbox-backend
    ports:
      - "8081:8081"
    networks:
      - sandbox-network
    restart: unless-stopped

  frontend:
    image: ${REPOSITORY_FRONTEND}:${IMAGE_TAG:-latest}
    container_name: sandbox-frontend
    ports:
      - "8888:8888"
    depends_on:
      - backend
    networks:
      - sandbox-network
    restart: unless-stopped

networks:
  sandbox-network:
    driver: bridge